name: Build blog, sitemap & fs.json

on:
  push:
    branches: [main]
    paths-ignore:
      - sitemap.xml
      - fs.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install blog dependencies
        run: pip install -r scripts/requirements-blog.txt

      - name: Build essays (blog/posts-src -> blog/essays)
        run: python3 scripts/build-blog.py

      - name: Commit generated blog if changed
        run: |
          git add -A blog/essays assets/blog/moe-pygments.css
          if git diff --cached --quiet; then
            echo "blog output unchanged"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: build blog [skip ci]"
          fi

      - name: Generate sitemap.xml (after the blog commit so lastmod is right)
        run: python3 scripts/gen-sitemap.py

      - name: Commit sitemap if changed
        run: |
          git add sitemap.xml
          if git diff --cached --quiet; then
            echo "sitemap.xml unchanged"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: update sitemap.xml [skip ci]"
          fi

      - name: Generate fs.json for the terminal (last, so mtimes include the commits above)
        run: python3 scripts/gen-fs.py

      - name: Commit fs.json if changed
        run: |
          git add fs.json
          if git diff --cached --quiet; then
            echo "fs.json unchanged"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: update fs.json [skip ci]"
          fi

      - name: Push
        run: |
          if [ "$(git rev-list --count origin/main..HEAD)" -gt 0 ]; then
            git push
          else
            echo "nothing to push"
          fi
